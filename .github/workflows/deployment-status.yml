name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.commit_info.outputs.previous_sha }}
      current_sha: ${{ steps.commit_info.outputs.current_sha }}
      package_version: ${{ steps.commit_info.outputs.package_version }}
      package_name: ${{ steps.commit_info.outputs.package_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run lint
        run: |
          if npm run | grep -q "^  lint"; then
            npm run lint || echo "Lint completed with warnings"
          else
            echo "No lint script found, skipping"
          fi
        continue-on-error: true

      - name: Run tests
        run: |
          if npm run | grep -q "^  test"; then
            npm test || echo "Tests completed with warnings"
          else
            echo "No test script found, skipping"
          fi
        continue-on-error: true

      - name: Capture commit information
        id: commit_info
        run: |
          CURRENT_SHA="${{ github.sha }}"
          PREVIOUS_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "none")
          PACKAGE_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          PACKAGE_NAME=$(node -p "require('./package.json').name" 2>/dev/null || echo "unknown")
          echo "current_sha=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "previous_sha=$PREVIOUS_SHA" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Current SHA: $CURRENT_SHA"
          echo "Previous SHA: $PREVIOUS_SHA"
          echo "Package Version: $PACKAGE_VERSION"
          echo "Package Name: $PACKAGE_NAME"

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.substring(0, 7);
            const previousSha = '${{ steps.commit_info.outputs.previous_sha }}';
            const packageVersion = '${{ steps.commit_info.outputs.package_version }}';
            const packageName = '${{ steps.commit_info.outputs.package_name }}';

            const body = [
              '## 🚀 Deployment Tracking',
              '',
              '**Deployment Information:**',
              `- Package: ${packageName}`,
              `- Package Version: ${packageVersion}`,
              `- Current Commit: ${sha}`,
              `- Previous Commit: ${previousSha}`,
              `- Triggered by: @${context.actor}`,
              `- Workflow Run: ${context.runId}`,
              '',
              '**Status:** In Progress',
              '',
              'This issue tracks the deployment lifecycle of this commit.'
            ].join('
');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: body,
              labels: ['deployment', 'in-progress']
            });

            core.setOutput('issue_number', issue.data.number);
            console.log(`Created deployment tracking issue #${issue.data.number}`);

      - name: Post pre-deployment checks comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create_issue.outputs.issue_number }}');
            const previousSha = '${{ steps.commit_info.outputs.previous_sha }}';
            const packageVersion = '${{ steps.commit_info.outputs.package_version }}';

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              '**Quality Checks:**',
              '- ✅ Lint check executed',
              '- ✅ Test suite executed',
              '- ✅ Commit information captured',
              '',
              '**Captured Information:**',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${context.sha}`,
              `- Package Version: ${packageVersion}`,
              '',
              'Pre-deployment checks completed successfully. Proceeding to rollback preparation.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  rollback-preparation:
    name: rollback-preparation
    needs: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package_artifact.outputs.artifact_name }}
      artifact_checksum: ${{ steps.package_artifact.outputs.artifact_checksum }}
      script_created: ${{ steps.verify.outputs.script_created }}
      backup_created: ${{ steps.verify.outputs.backup_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare rollback workspace
        run: |
          mkdir -p rollback-package/scripts
          mkdir -p rollback-package/backups
          mkdir -p rollback-package/docs

      - name: Create rollback script
        id: rollback_script
        run: |
          cat > rollback-package/scripts/rollback.sh <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # Rollback Script
          # Restores the application to the previous commit state.
          set -euo pipefail

          PREVIOUS_SHA="${{ needs.pre-deployment.outputs.previous_sha }}"
          CURRENT_SHA="${{ needs.pre-deployment.outputs.current_sha }}"
          PACKAGE_VERSION="${{ needs.pre-deployment.outputs.package_version }}"

          log() {
            echo "[rollback] $(date -u +"%Y-%m-%dT%H:%M:%SZ") $*"
          }

          err() {
            echo "[rollback][error] $*" >&2
          }

          trap 'err "Rollback failed at line $LINENO"; exit 1' ERR

          log "Starting rollback procedure"
          log "Previous Commit: ${PREVIOUS_SHA}"
          log "Current Commit: ${CURRENT_SHA}"
          log "Package Version: ${PACKAGE_VERSION}"

          if [ "${PREVIOUS_SHA}" = "none" ] || [ -z "${PREVIOUS_SHA}" ]; then
            err "No previous commit available, cannot rollback"
            exit 1
          fi

          if ! command -v git >/dev/null 2>&1; then
            err "git is required but not installed"
            exit 1
          fi

          log "Verifying repository state"
          git status >/dev/null

          log "Restoring configuration backups"
          if [ -d "$(dirname "$0")/../backups" ]; then
            cp -f "$(dirname "$0")/../backups/package.json" ./package.json 2>/dev/null || true
            cp -f "$(dirname "$0")/../backups/package-lock.json" ./package-lock.json 2>/dev/null || true
          fi

          log "Resetting working tree to previous commit"
          git fetch --all --tags || true
          git checkout "${PREVIOUS_SHA}" -- . || {
            err "Failed to checkout previous commit"
            exit 1
          }

          log "Reinstalling dependencies"
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          log "Rollback completed successfully"
          ROLLBACK_EOF
          chmod +x rollback-package/scripts/rollback.sh
          echo "script_created=true" >> $GITHUB_OUTPUT
          # Validate script syntax
          bash -n rollback-package/scripts/rollback.sh

      - name: Create configuration backups
        id: config_backup
        run: |
          cp package.json rollback-package/backups/package.json
          if [ -f package-lock.json ]; then
            cp package-lock.json rollback-package/backups/package-lock.json
          else
            echo '{}' > rollback-package/backups/package-lock.json
          fi
          # Environment template
          cat > rollback-package/backups/.env.template <<'ENV_EOF'
          # Environment template captured at deployment time
          NODE_ENV=production
          APP_VERSION=${{ needs.pre-deployment.outputs.package_version }}
          APP_COMMIT=${{ needs.pre-deployment.outputs.current_sha }}
          ENV_EOF
          echo "backup_created=true" >> $GITHUB_OUTPUT

      - name: Create dependency verification script
        run: |
          cat > rollback-package/scripts/verify-deps.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Dependency Verification Script
          # Confirms compatibility of installed dependencies with package.json.
          set -euo pipefail

          log() {
            echo "[verify-deps] $*"
          }

          if ! command -v node >/dev/null 2>&1; then
            echo "[verify-deps][error] Node.js is required" >&2
            exit 1
          fi

          if [ ! -f package.json ]; then
            echo "[verify-deps][error] package.json not found" >&2
            exit 1
          fi

          log "Validating package.json"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

          if [ -f package-lock.json ]; then
            log "Validating package-lock.json"
            node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"
          fi

          log "Checking installed packages match manifests"
          if command -v npm >/dev/null 2>&1; then
            npm ls --all >/dev/null 2>&1 || log "Some optional dependencies may be missing"
          fi

          log "Dependency verification completed"
          VERIFY_EOF
          chmod +x rollback-package/scripts/verify-deps.sh
          bash -n rollback-package/scripts/verify-deps.sh

      - name: Create rollback documentation
        run: |
          cat > rollback-package/docs/ROLLBACK.md <<'DOC_EOF'
          # Rollback Documentation

          This package contains everything needed to roll back the deployment
          for commit `${{ needs.pre-deployment.outputs.current_sha }}` back to
          commit `${{ needs.pre-deployment.outputs.previous_sha }}`.

          ## Package Information

          - Package Version: ${{ needs.pre-deployment.outputs.package_version }}
          - Previous Commit: ${{ needs.pre-deployment.outputs.previous_sha }}
          - Current Commit: ${{ needs.pre-deployment.outputs.current_sha }}

          ## Contents

          - `scripts/rollback.sh` — Executable rollback script
          - `scripts/verify-deps.sh` — Dependency verification script
          - `backups/package.json` — Backup of the manifest
          - `backups/package-lock.json` — Backup of the lockfile
          - `backups/.env.template` — Environment template

          ## Step-by-Step Rollback Instructions

          1. Download the rollback artifact `rollback-package-${{ needs.pre-deployment.outputs.current_sha }}` from the GitHub Actions run.
          2. Extract the archive: `tar -xzf rollback-package.tar.gz`.
          3. Verify the SHA256 checksum against the value reported in the deployment issue.
          4. Run the verification script: `./scripts/verify-deps.sh`.
          5. Execute the rollback: `./scripts/rollback.sh`.
          6. Re-run smoke tests to confirm the previous version is healthy.
          7. Update monitoring dashboards and notify stakeholders.

          ## Quick Rollback Command

          ```bash
          tar -xzf rollback-package.tar.gz && \
            cd rollback-package && \
            ./scripts/verify-deps.sh && \
            ./scripts/rollback.sh
          ```

          ## Recovery Verification

          After rollback completes:

          - Confirm the application reports version `${{ needs.pre-deployment.outputs.package_version }}` is no longer active.
          - Verify the deployment tracking issue is closed.
          - Inspect logs and metrics for at least 15 minutes.
          DOC_EOF

      - name: Create rollback metadata
        run: |
          cat > rollback-package/metadata.json <<META_EOF
          {
            "previous_commit": "${{ needs.pre-deployment.outputs.previous_sha }}",
            "current_commit": "${{ needs.pre-deployment.outputs.current_sha }}",
            "package_version": "${{ needs.pre-deployment.outputs.package_version }}",
            "package_name": "${{ needs.pre-deployment.outputs.package_name }}",
            "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          META_EOF

      - name: Verify rollback components
        id: verify
        run: |
          test -x rollback-package/scripts/rollback.sh && echo "Rollback script ok"
          test -x rollback-package/scripts/verify-deps.sh && echo "Verify script ok"
          test -f rollback-package/backups/package.json && echo "Backup ok"
          test -f rollback-package/backups/package-lock.json && echo "Lockfile backup ok"
          test -f rollback-package/backups/.env.template && echo "Env template ok"
          test -f rollback-package/docs/ROLLBACK.md && echo "Docs ok"
          test -f rollback-package/metadata.json && echo "Metadata ok"
          echo "script_created=true" >> $GITHUB_OUTPUT
          echo "backup_created=true" >> $GITHUB_OUTPUT

      - name: Package and checksum rollback artifact
        id: package_artifact
        run: |
          SHORT_SHA="${{ needs.pre-deployment.outputs.current_sha }}"
          ARTIFACT_NAME="rollback-package-${SHORT_SHA}"
          tar -czf rollback-package.tar.gz rollback-package
          CHECKSUM=$(sha256sum rollback-package.tar.gz | awk '{print $1}')
          sha256sum rollback-package.tar.gz > rollback-package.tar.gz.sha256
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "artifact_checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "Artifact: ${ARTIFACT_NAME}"
          echo "SHA256: ${CHECKSUM}"

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_artifact.outputs.artifact_name }}
          path: |
            rollback-package.tar.gz
            rollback-package.tar.gz.sha256
            rollback-package/
          retention-days: 30

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ARTIFACT_NAME: ${{ steps.package_artifact.outputs.artifact_name }}
          ARTIFACT_CHECKSUM: ${{ steps.package_artifact.outputs.artifact_checksum }}
          SCRIPT_CREATED: ${{ steps.verify.outputs.script_created }}
          BACKUP_CREATED: ${{ steps.verify.outputs.backup_created }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const artifactChecksum = process.env.ARTIFACT_CHECKSUM;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupCreated = process.env.BACKUP_CREATED;

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              '**Deployment Reference:**',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              '',
              '**Rollback Components:**',
              '- ✅ Executable rollback script created',
              '- ✅ Configuration backups captured (package.json, package-lock.json, .env.template)',
              '- ✅ Dependency verification script generated',
              '- ✅ Rollback documentation written',
              '- ✅ Compressed rollback package built',
              '- ✅ SHA256 checksum computed',
              '',
              '**Verification:**',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              `- SHA256: ${artifactChecksum}`,
              '',
              '**Quick rollback command:**',
              '',
              '```bash',
              `# Download artifact ${artifactName} from the workflow run`,
              'tar -xzf rollback-package.tar.gz',
              'cd rollback-package',
              './scripts/verify-deps.sh',
              './scripts/rollback.sh',
              '```',
              '',
              'Rollback artifacts have been uploaded to GitHub Actions with 30-day retention.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  post-deployment:
    name: post-deployment
    needs: [pre-deployment, rollback-preparation]
    runs-on: ubuntu-latest
    steps:
      - name: Update issue labels
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (error) {
              console.log(`Could not remove in-progress label: ${error.message}`);
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });

      - name: Post final deployment comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          ARTIFACT_NAME: ${{ needs.rollback-preparation.outputs.artifact_name }}
          ARTIFACT_CHECKSUM: ${{ needs.rollback-preparation.outputs.artifact_checksum }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const artifactName = process.env.ARTIFACT_NAME;
            const artifactChecksum = process.env.ARTIFACT_CHECKSUM;
            const packageVersion = process.env.PACKAGE_VERSION;
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;

            const body = [
              '## 🎉 Deployment Completed Successfully',
              '',
              '**Deployment Summary:**',
              `- Package Version: ${packageVersion}`,
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              '',
              '**Rollback Artifact Details:**',
              `- Artifact: ${artifactName}`,
              `- SHA256: ${artifactChecksum}`,
              '- Retention: 30 days',
              '',
              'All deployment stages completed successfully. The deployment tracking issue is now being closed.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

      - name: Close deployment tracking issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
